<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RISEN Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#11242F;--soft:#40606E;--paper:#EDF0F1;--card:#fff;--line:#C9D4D8;--accent:#2F4FE0;--amber:#D98A16;--ok:#1E7A5C;--r:3px}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
header.masthead{border-bottom:1px solid var(--ink);padding:28px 24px 20px;max-width:1320px;margin:0 auto;position:relative}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft)}
h1.title{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(34px,6vw,58px);line-height:1;margin:8px 0 6px;letter-spacing:-.01em}
h1.title em{font-style:italic;color:var(--accent)}
.standfirst{max-width:64ch;color:var(--soft);margin:0}
.langs{position:absolute;top:24px;right:24px;display:flex;gap:4px}
.langs button{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;border:1px solid var(--line);background:none;color:var(--soft);padding:5px 9px;border-radius:var(--r);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
@media (max-width:600px){.langs{position:static;margin-bottom:12px}}
.wrap{max-width:1320px;margin:0 auto;padding:24px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:960px){.wrap{grid-template-columns:1fr;gap:24px}}
.block{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
.block.done{border-color:var(--ink)}
.block-head{display:flex;align-items:flex-start;gap:16px;padding:16px 18px;cursor:pointer;background:none;border:0;width:100%;text-align:left;font:inherit;color:inherit}
.block-head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.letter{font-family:'Instrument Serif',serif;font-size:44px;line-height:.8;width:36px;flex:0 0 36px;color:var(--line);transition:color .2s}
.block.done .letter{color:var(--accent)}
.block-head h2{font-size:16px;margin:0 0 2px;font-weight:600;letter-spacing:-.01em}
.block-head p{margin:0;font-size:13.5px;color:var(--soft);max-width:56ch}
.head-right{margin-left:auto;display:flex;align-items:center;gap:10px;padding-top:4px}
.status{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);white-space:nowrap}
.block.done .status{color:var(--ok)}
.chevron{transition:transform .2s;color:var(--soft);font-size:12px}
.block.open .chevron{transform:rotate(180deg)}
.block-body{display:none;padding:4px 18px 20px 70px;border-top:1px dashed var(--line)}
.block.open .block-body{display:block}
@media (max-width:600px){.block-body{padding-left:18px}}
.field{margin-top:16px}
label{display:block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:5px}
.hint{font-size:12.5px;color:var(--soft);margin:0 0 6px;font-style:italic}
input[type=text],textarea,select{width:100%;font-family:inherit;font-size:14.5px;color:var(--ink);background:#FBFCFC;border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;resize:vertical}
input[type=text]:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,79,224,.12)}
textarea{min-height:84px;line-height:1.5}
.step-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.step-num{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--accent);padding-top:11px;width:22px;flex:0 0 22px}
.step-row textarea{min-height:44px}
.icon-btn{background:none;border:1px solid var(--line);color:var(--soft);border-radius:var(--r);cursor:pointer;width:30px;height:30px;flex:0 0 30px;margin-top:5px;font-size:15px;line-height:1}
.icon-btn:hover{border-color:var(--ink);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:12.5px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:#FBFCFC;cursor:pointer;color:var(--soft);font-family:inherit}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.panel{position:sticky;top:24px}
@media (max-width:960px){.panel{position:static}}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--ink);padding-bottom:8px}
.panel-head h2{font-family:'Instrument Serif',serif;font-weight:400;font-size:26px;margin:0}
.meter{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--soft);letter-spacing:.08em}
pre.out{margin:0;background:var(--ink);color:#E8EEF0;font-family:'IBM Plex Mono',monospace;font-size:12.5px;line-height:1.65;padding:22px;border-radius:0 0 var(--r) var(--r);white-space:pre-wrap;word-wrap:break-word;max-height:64vh;overflow:auto}
pre.out .h{color:var(--amber)}
pre.out .ghost{color:#6E8794;font-style:italic}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button.act{font-family:inherit;font-size:13px;font-weight:500;padding:9px 15px;border-radius:var(--r);cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:#fff}
button.act.ghost{background:none;color:var(--ink)}
button.act:hover{opacity:.87}
button.act:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
footer.foot{max-width:1320px;margin:0 auto;padding:8px 24px 48px;color:var(--soft);font-size:12.5px}
.msg{font-size:13px;color:#B3261E;margin:8px 0 0}
/* language chooser */
.chooser{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.chooser-in{max-width:640px;width:100%;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:40px 0}
.chooser h1{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(44px,9vw,84px);line-height:.95;margin:10px 0 14px}
.chooser h1 em{font-style:italic;color:var(--accent)}
.chooser p{color:var(--soft);margin:0 0 28px;font-size:16px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:480px){.pick{grid-template-columns:1fr}}
.pick button{font-family:inherit;text-align:left;border:1px solid var(--ink);background:var(--card);color:var(--ink);border-radius:var(--r);padding:20px 22px;cursor:pointer}
.pick button:hover{background:var(--ink);color:#fff}
.pick button:hover small{color:#C9D4D8}
.pick b{display:block;font-family:'Instrument Serif',serif;font-weight:400;font-size:34px;line-height:1}
.pick small{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section class="chooser" id="chooser" hidden>
  <div class="chooser-in">
    <div class="eyebrow">R.I.S.E.N. · Role · Instructions · Steps · End goal · Narrowing</div>
    <h1>RISEN <em>Builder</em></h1>
    <p>Scegli la lingua · Elegí el idioma</p>
    <div class="pick">
      <button type="button" data-pick="it"><b>Italiano</b><small>Costruttore di prompt</small></button>
      <button type="button" data-pick="es"><b>Español</b><small>Constructor de prompts</small></button>
    </div>
  </div>
</section>

<div id="app" hidden>
<header class="masthead">
  <div class="langs" role="group" aria-label="Lingua / Idioma">
    <button type="button" data-lang="it" aria-pressed="false">IT</button>
    <button type="button" data-lang="es" aria-pressed="false">ES</button>
  </div>
  <div class="eyebrow" data-t="eyebrow"></div>
  <h1 class="title" data-t="title" data-html></h1>
  <p class="standfirst" data-t="standfirst"></p>
</header>

<div class="wrap">
  <main><div id="blocks"></div></main>
  <aside class="panel">
    <div class="panel-head"><h2 data-t="panel"></h2><span class="meter" id="meter"></span></div>
    <pre class="out" id="out"></pre>
    <div class="actions">
      <button class="act" id="btnCopy" data-t="copy"></button>
      <button class="act ghost" id="btnMd" data-t="md"></button>
      <button class="act ghost" id="btnJson" data-t="json"></button>
      <button class="act ghost" id="btnLoad" data-t="load"></button>
      <button class="act ghost" id="btnClear" data-t="clear"></button>
      <input type="file" id="fileIn" accept="application/json" hidden>
    </div>
    <p class="hint" style="margin-top:10px" data-t="filehint"></p>
    <p class="msg" id="msg" role="status" hidden></p>
  </aside>
</div>
<footer class="foot" data-t="foot"></footer>
</div>

 if(f.ty==="chips"){const s=L[f.src];return '<div class="field"><label>'+f.lb+'</label><p class="hint">'+f.h+'</p><div class="chips" data-g="'+f.k+'">'+s.map((t,i)=>'<button type="button" class="chip" aria-pressed="false" data-i="'+i+'">'+esc(t)+'</button>').join("")+'</div></div>';}
 if(f.ty==="sel")return '<div class="field"><label for="f_'+f.k+'">'+f.lb+'</label><select id="f_'+f.k+'" data-sel="'+f.k+'">'+L.lens.map((l,i)=>'<option value="'+i+'">'+esc(l)+'</option>').join("")+'</select></div>';
 const el=f.ty==="ta"?'<textarea id="f_'+f.k+'" data-k="'+f.k+'" placeholder="'+esc(f.p)+'"></textarea>':'<input type="text" id="f_'+f.k+'" data-k="'+f.k+'" placeholder="'+esc(f.p)+'">';
 return '<div class="field"><label for="f_'+f.k+'">'+f.lb+'</label><p class="hint">'+f.h+'</p>'+el+'</div>';
}

function mount(){
 const open=[...document.querySelectorAll(".block.open")].map(b=>b.id);
 $("blocks").innerHTML=L.B.map((b,i)=>'<section class="block" id="b_'+b.id+'"><button class="block-head" type="button" aria-expanded="false"><span class="letter">'+b.l+'</span><span><h2>'+b.t+'</h2><p>'+b.s+'</p></span><span class="head-right"><span class="status" data-st></span><span class="chevron">&#9660;</span></span></button><div class="block-body">'+b.f.map(fh).join("")+'</div></section>').join("");
 (open.length?open:["b_role"]).forEach(id=>{const b=$(id);if(b){b.classList.add("open");b.querySelector(".block-head").setAttribute("aria-expanded","true");}});
 document.querySelectorAll(".block-head").forEach(h=>h.addEventListener("click",()=>{const b=h.closest(".block");h.setAttribute("aria-expanded",b.classList.toggle("open"));}));
 $("addStep").addEventListener("click",()=>{state.steps.push("");rsteps();render();});
 sync(false);
}

function rsteps(){
 const sl=$("stepList");
 sl.innerHTML=state.steps.map((s,i)=>'<div class="step-row"><span class="step-num">'+String(i+1).padStart(2,"0")+'</span><textarea data-s="'+i+'" placeholder="'+esc(i===0?L.stepFirst:L.stepNext)+'">'+esc(s)+'</textarea><button class="icon-btn" type="button" data-d="'+i+'" title="'+esc(L.stepDel)+'" aria-label="'+esc(L.stepDel)+'">&times;</button></div>').join("");
}
document.addEventListener("input",e=>{
 const k=e.target.dataset.k; if(k){state[k]=e.target.value;render();return;}
 const i=e.target.dataset.s; if(i!==undefined){state.steps[+i]=e.target.value;render();}
});
document.addEventListener("change",e=>{const k=e.target.dataset.sel;if(k){state[k]=+e.target.value;render();}});
document.addEventListener("click",e=>{
 const d=e.target.closest("[data-d]");
 if(d){state.steps.splice(+d.dataset.d,1);if(!state.steps.length)state.steps.push("");rsteps();render();return;}
 const c=e.target.closest(".chip[data-i]");if(!c)return;
 const g=c.closest("[data-g]").dataset.g,i=+c.dataset.i,on=state[g].indexOf(i)>-1;
 state[g]=on?state[g].filter(x=>x!==i):state[g].concat([i]);
 c.setAttribute("aria-pressed",String(!on));render();
});

const lines=t=>t.split("\n").map(s=>s.trim()).filter(Boolean);
function build(){
 const s=state,o=[],O=L.out,G=L.ghost,st=s.steps.map(x=>x.trim()).filter(Boolean);
 const bans=s.bans.slice().sort((a,b)=>a-b).map(i=>L.bans[i]).concat(lines(s.extraBans));
 o.push(O.role);o.push(s.role||G);if(s.expertise)o.push(s.expertise);if(s.voice)o.push(O.voice+s.voice);o.push("");
 o.push(O.task);o.push(s.task||G);
 if(s.method){o.push("");o.push(O.method);o.push(s.method);}
 if(s.criteria){o.push("");o.push(O.criteria);o.push(lines(s.criteria).map(x=>"- "+x).join("\n"));}o.push("");
 o.push(O.steps);o.push(st.length?st.map((t,i)=>(i+1)+". "+t).join("\n"):"1. "+G);o.push(O.stepsRule);o.push("");
 o.push(O.goal);o.push(s.goal||G);
 if(s.success)o.push(O.success+s.success);
 if(s.format){o.push("");o.push(O.format);o.push(s.format);}o.push("");
 o.push(O.bans);o.push(bans.length?bans.map(b=>"- "+b).join("\n"):"- "+G);
 if(s.tone.length)o.push("\n"+O.tone+s.tone.slice().sort((a,b)=>a-b).map(i=>L.tones[i]).join(", ").toLowerCase()+".");
 o.push(O.length+L.lens[s.length].toLowerCase()+".");
 if(s.edge){o.push("");o.push(O.edge);o.push(lines(s.edge).map(x=>"- "+x).join("\n"));}
 o.push("");o.push("---");o.push(O.close);
 return o.join("\n");
}

function render(){
 const t=build(),gh=esc(L.ghost);
 $("out").innerHTML=esc(t).replace(/^(#{1,2} .*)$/gm,'<span class="h">$1</span>').split(gh).join('<span class="ghost">'+gh+'</span>');
 const c=[!!state.role.trim(),!!state.task.trim(),state.steps.filter(x=>x.trim()).length>=2,!!state.goal.trim(),(state.bans.length+lines(state.extraBans).length)>0];
 $("meter").textContent=c.filter(Boolean).length+L.meter;
 L.B.forEach((b,i)=>{const el=$("b_"+b.id);el.classList.toggle("done",c[i]);el.querySelector("[data-st]").textContent=c[i]?L.done:L.todo;});
}

function sync(openAll){
 document.querySelectorAll("[data-k]").forEach(el=>{const v=state[el.dataset.k];if(typeof v==="string")el.value=v;});
 document.querySelectorAll("[data-g]").forEach(g=>{const a=state[g.dataset.g];g.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",String(a.indexOf(+c.dataset.i)>-1)));});
 const sel=$("f_length");if(sel)sel.value=String(state.length);
 rsteps();
 if(openAll){document.querySelectorAll(".block").forEach(b=>b.classList.add("open"));document.querySelectorAll(".block-head").forEach(h=>h.setAttribute("aria-expanded","true"));}
 render();
}

function applyLang(l){
 lang=l==="es"?"es":"it";L=T[lang];
 document.documentElement.lang=lang;document.title=L.doc;
 document.querySelectorAll("[data-t]").forEach(el=>{const v=L[el.dataset.t];if(el.hasAttribute("data-html"))el.innerHTML=v;else el.textContent=v;});
 document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
 setSaved(lang);
 if(location.hash!=="#"+lang){try{history.replaceState(null,"","#"+lang);}catch(e){}}
 mount();
}
function start(l){$("chooser").hidden=true;$("app").hidden=false;applyLang(l);window.scrollTo(0,0);}
document.querySelectorAll("[data-pick]").forEach(b=>b.addEventListener("click",()=>start(b.dataset.pick)));
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>applyLang(b.dataset.lang)));

/* files */
function msg(t){const m=$("msg");m.textContent=t;m.hidden=false;setTimeout(()=>{m.hidden=true;},4000);}
function download(name,content,type){try{const blob=new Blob([content],{type});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}catch(e){}}
$("btnCopy").addEventListener("click",async e=>{const b=e.currentTarget;try{await navigator.clipboard.writeText(build());b.textContent=L.copied;}catch(x){b.textContent=L.copyFail;}setTimeout(()=>b.textContent=L.copy,1800);});
$("btnMd").addEventListener("click",()=>download("risen-prompt.md",build(),"text/markdown"));
$("btnJson").addEventListener("click",()=>download("risen-"+(lang==="es"?"ficha":"scheda")+".json",JSON.stringify(state,null,2),"application/json"));
$("btnLoad").addEventListener("click",()=>$("fileIn").click());
function toIdx(arr,lists){return (arr||[]).map(v=>{if(typeof v==="number")return v;for(const l of lists){const i=l.indexOf(v);if(i>-1)return i;}return -1;}).filter(i=>i>-1);}
$("fileIn").addEventListener("change",()=>{const f=$("fileIn").files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);
 Object.keys(EMPTY).forEach(k=>{if(d[k]!==undefined)state[k]=d[k];});
 state.bans=toIdx(d.bans,[T.it.bans,T.es.bans]);state.tone=toIdx(d.tone,[T.it.tones,T.es.tones]);
 if(typeof d.length==="string"){const i=Math.max(T.it.lens.indexOf(d.length),T.es.lens.indexOf(d.length));state.length=i>-1?i:1;}
 if(typeof state.length!=="number"||!L.lens[state.length])state.length=1;
 if(!Array.isArray(state.steps)||!state.steps.length)state.steps=[""];
 sync(true);}catch(x){msg(L.badfile);}};r.readAsText(f);$("fileIn").value="";});
let armed=false;
$("btnClear").addEventListener("click",e=>{const b=e.currentTarget;if(!armed){armed=true;b.textContent=L.confirm;setTimeout(()=>{armed=false;b.textContent=L.clear;},3000);return;}armed=false;b.textContent=L.clear;Object.assign(state,JSON.parse(JSON.stringify(EMPTY)));sync(false);});

/* entry: #it / #es skip the chooser (handy for QR codes); otherwise ask */
const h=location.hash.replace("#","");
if(h==="it"||h==="es")start(h);
else $("chooser").hidden=false;
</script>
</body>
</html>
